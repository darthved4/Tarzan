# Core peripherals used by the Tarzan module.
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_STEPPER=y

# Sensors used by drive/src/test/madgwick_test.c.
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_NONE=y
CONFIG_LSM9DS1_MAG=y

# Test output on the UART selected by madgwick_test.overlay.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Tarzan module dependencies.
CONFIG_Tarzan=y
CONFIG_CRC=y
