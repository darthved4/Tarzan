# First Link/Yako GPIO plus turntable and First Link orientation hardware.
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_NONE=y
CONFIG_LSM9DS1_MAG=y

# Interactive demo console on the UART selected by yako_pid.overlay.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Tarzan PID, Madgwick, complementary, and link-orientation helpers.
CONFIG_Tarzan=y
CONFIG_MAIN_STACK_SIZE=4096
